<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMR and ESG Limit Widget</title>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    :root{--ink:#17211d;--muted:#66736d;--line:#d8e1dc;--blue:#315f78;--light:#e7f0f5}
    *{box-sizing:border-box}body{margin:0;padding:14px;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f8f6}.widget{max-width:620px;margin:auto;padding:20px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:14px}.head,.actions,.output-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{margin:0;font-size:21px}.head p{margin:3px 0 0;color:var(--muted);font-size:12px}.badge{padding:4px 7px;color:#23495d;background:var(--light);border-radius:6px;font-size:10px;font-weight:800}.stamp{color:var(--muted);font-size:9px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700}select{width:100%;min-height:42px;padding:8px;border:1px solid #b8c6bf;border-radius:8px;background:#fff;font:inherit}.toggle{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:12px}.toggle label{display:flex;align-items:center;justify-content:center;flex-direction:row;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.toggle input{margin:0}
    .output{margin-top:14px;padding:15px;background:#f7faf8;border:1px solid var(--line);border-radius:10px}.output>span,.output small{display:block;color:var(--muted);font-size:11px}.output strong{font-size:34px;letter-spacing:-1px}button{padding:7px 10px;color:#23495d;background:var(--light);border:1px solid #c9dbe5;border-radius:7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.actions{justify-content:flex-start;margin-top:12px;flex-wrap:wrap}details{margin-top:14px;border-top:1px solid var(--line)}summary{padding-top:12px;color:#23495d;font-weight:800;cursor:pointer}.details{padding-top:8px;color:#46534c;font-size:12px}.formula,.payload{padding:8px;background:#f7faf8;border-radius:7px;font:10px ui-monospace,monospace;overflow-wrap:anywhere}.payload{margin-top:10px;color:var(--muted)}
    @media(max-width:480px){.grid{grid-template-columns:1fr}}@media print{body{padding:0;background:#fff}.widget{border:0}.no-print{display:none!important}}
  </style>
</head>
<body>
  <main class="widget">
    <header class="head"><div><h1>FMR and ESG Limit</h1><p>Monthly FMR or two-month ESG asset limit</p></div><div><span class="badge">FMR / ESG</span><div id="stamp" class="stamp">v. 05-2026</div></div></header>
    <div class="grid"><label>County<select id="county"><option value="">Select county</option></select></label><label>Unit size<select id="unitSize"><option value="">Select unit size</option><option value="Studio">Studio</option><option value="1BR">1 bedroom</option><option value="2BR">2 bedrooms</option><option value="3BR">3 bedrooms</option><option value="4BR">4 bedrooms</option></select></label></div>
    <div class="toggle"><label><input type="radio" name="rateType" value="FMR" checked> FMR</label><label><input type="radio" name="rateType" value="ESG"> ESG Asset Limit</label></div>
    <section class="output"><span id="outputLabel">MONTHLY FMR</span><div class="output-row"><strong id="result">—</strong><button id="copy" class="no-print" disabled>Copy number</button></div><small id="context">Select county and unit size</small></section>
    <div class="actions no-print"><button id="pdf">Export formatted PDF</button><button id="json">Export JSON</button></div>
    <details><summary>Details explained</summary><div class="details"><p id="formula" class="formula">Select county and unit size.</p><p id="sourceNote">Default FMR matrix • version 05-2026</p><div class="payload"><strong>Jotform field value:</strong> <span id="payload">Complete the required selections</span></div></div></details>
  </main>
  <script>
    const SIZE_KEYS=["Studio","1BR","2BR","3BR","4BR"],DEFAULT_TABLE={Gallatin:{Studio:1485,"1BR":1642,"2BR":2154,"3BR":2996,"4BR":3537},Park:{Studio:1107,"1BR":1385,"2BR":1605,"3BR":2232,"4BR":2692},Meagher:{Studio:1044,"1BR":1087,"2BR":1393,"3BR":1925,"4BR":2252}};
    let fmrTable={...DEFAULT_TABLE},state={fmr:null,value:null,rateType:"FMR"},submitString="",jfReady=false,matrixLabel="05-2026";
    const $=id=>document.getElementById(id),money=number=>number==null?"—":Number(number).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
    function auditValue(value){return String(value??"").replace(/[|\r\n]+/g," ").trim()}
    function parseMatrix(raw){const output={};String(raw||"").split(/\n+/).forEach(line=>{const match=line.trim().match(/^([^:\[]+)\s*:\s*\[([^\]]+)]/);if(!match)return;const values=match[2].split(/[, ]+/).map(value=>Number(value.replace(/\$/g,""))).filter(Number.isFinite);if(values.length===SIZE_KEYS.length){output[match[1].trim().replace(/\s+/g," ")]=Object.fromEntries(SIZE_KEYS.map((key,index)=>[key,values[index]]))}});return Object.keys(output).length?output:{...DEFAULT_TABLE}}
    function rebuildCounties(){const current=$("county").value;$("county").innerHTML='<option value="">Select county</option>';Object.keys(fmrTable).forEach(county=>{const option=document.createElement("option");option.value=option.textContent=county;$("county").appendChild(option)});if(fmrTable[current])$("county").value=current}
    function calculate(){const county=$("county").value,size=$("unitSize").value,rateType=[...document.getElementsByName("rateType")].find(radio=>radio.checked)?.value||"FMR";state.fmr=county&&size&&fmrTable[county]?fmrTable[county][size]:null;state.rateType=rateType;state.value=state.fmr==null?null:rateType==="ESG"?Math.round(2*.8*state.fmr):state.fmr;submitString=state.value==null?"":`CalcV:2|Widget:FMR_ESG|County:${auditValue(county)}|UnitSize:${auditValue(size)}|RateType:${rateType}|MonthlyFMR:${state.fmr.toFixed(2)}|OutputLimit:${state.value.toFixed(2)}|Formula:${rateType==="ESG"?"2x80pctFMR":"MatrixFMR"}|Matrix:${auditValue(matrixLabel)}`;
      $("result").textContent=money(state.value);$("copy").disabled=state.value==null;$("outputLabel").textContent=rateType==="ESG"?"ESG ASSET LIMIT":"MONTHLY FMR";$("context").textContent=state.value==null?"Select county and unit size":`${county} County • ${size}`;$("formula").textContent=state.value==null?"Select county and unit size.":rateType==="ESG"?`2 × 80% × ${money(state.fmr)} = ${money(state.value)} (rounded)`:`May 2026 matrix lookup = ${money(state.value)}`;$("payload").textContent=submitString||"Complete the required selections";if(jfReady)JFCustomWidget.sendData({value:submitString})}
    function restore(value){const data=Object.fromEntries(String(value||"").split("|").map(part=>{const i=part.indexOf(":");return i>0?[part.slice(0,i),part.slice(i+1)]:["",""]}));if(data.County&&fmrTable[data.County])$("county").value=data.County;if(data.UnitSize)$("unitSize").value=data.UnitSize;const radio=document.querySelector(`input[name="rateType"][value="${data.RateType||"FMR"}"]`);if(radio)radio.checked=true}
    function exportJSON(){const data={widget:"FMR and ESG Limit",version:"05-2026",county:$("county").value,unitSize:$("unitSize").value,...state,jotformValue:submitString},link=document.createElement("a");link.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));link.download="fmr-esg-widget-result.json";link.click();URL.revokeObjectURL(link.href)}
    function exportPDF(){if(state.value==null){alert("Select county and unit size before exporting.");return}const county=$("county").value,size=$("unitSize").value,report=window.open("","_blank","width=800,height=800");if(!report){alert("Allow pop-ups to export the formatted PDF.");return}report.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${state.rateType} Calculation</title><style>@page{size:letter;margin:.6in}body{color:#17211d;font:12px/1.5 Arial,sans-serif}header{padding-bottom:14px;border-bottom:3px solid #315f78}h1{margin:0;font-size:24px}.result{margin:25px 0;padding:22px;color:white;background:#315f78;border-radius:8px}.result span{display:block;font-size:10px}.result strong{font-size:38px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.facts div{padding:12px;border:1px solid #d8e1dc;border-radius:6px}.facts span{display:block;color:#66736d;font-size:9px}.payload{margin-top:20px;padding:8px;background:#f5f7f6;font:9px Consolas,monospace;overflow-wrap:anywhere}</style></head><body><header><h1>${state.rateType==="ESG"?"ESG Asset Limit":"Fair Market Rent"} Calculation</h1></header><section class="result"><span>${state.rateType}</span><strong>${money(state.value)}</strong></section><section class="facts"><div><span>County</span>${county}</div><div><span>Unit size</span>${size}</div><div><span>Monthly FMR</span>${money(state.fmr)}</div></section><p>${$("formula").textContent}</p><div class="payload"><strong>Jotform audit value:</strong><br>${submitString}</div></body></html>`);report.document.close();setTimeout(()=>{report.focus();report.print()},300)}
    rebuildCounties();["county","unitSize"].forEach(id=>$(id).addEventListener("input",calculate));document.getElementsByName("rateType").forEach(radio=>radio.addEventListener("input",calculate));$("copy").onclick=()=>navigator.clipboard?.writeText(String(state.value??""));$("pdf").onclick=exportPDF;$("json").onclick=exportJSON;calculate();
    if(window.JFCustomWidget){JFCustomWidget.subscribe("ready",data=>{const raw=String(JFCustomWidget.getWidgetSetting("fmr-matrix")||"").trim();fmrTable=parseMatrix(raw);rebuildCounties();const stamp=JFCustomWidget.getWidgetSetting("date-stamp")||"05-2026";matrixLabel=String(stamp);$("stamp").textContent=`v. ${stamp}`;$("sourceNote").textContent=raw?`Custom Jotform FMR matrix • ${stamp}`:"Default FMR matrix • version 05-2026";restore(data?.value);jfReady=true;calculate();JFCustomWidget.requestFrameResize({height:620})});JFCustomWidget.subscribe("submit",()=>JFCustomWidget.sendSubmit({valid:!!submitString,value:submitString}))}
  </script>
</body>
</html>
